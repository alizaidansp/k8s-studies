apiVersion: v1
kind: Pod
metadata:
  name: my-pod
spec:
  containers:
    - name: my-container
      image: my-image
      resources:
        requests:
          cpu: "500m"   # 500 millicores (0.5 vCPU)
          memory: "256Mi"  # 256 MiB of memory
        limits:
          cpu: "1000m"  # 1 vCPU
          memory: "512Mi"  # 512 MiB of memory
